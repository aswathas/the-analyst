<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Analyst" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0a" id="theme-color-meta" />
    <title>Analyst</title>
    <meta name="description" content="21CSS303T SRM Institute — Data Science exam pattern analysis, PYQ breakdown, and study guide by Aswath AS." />
    <script>
      // Set the theme before first paint so the canvas never flashes the wrong colour.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f8fc' : '#0a0a0a');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
